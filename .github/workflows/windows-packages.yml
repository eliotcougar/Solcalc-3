name: Windows packages

on:
  workflow_dispatch:
    inputs:
      verify_pubchem:
        description: Run the optional live PubChem lookup check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build and verify Windows packages
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/cargo
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        run: |
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: python tools/generate-catalog.py --check
      - run: python -m unittest discover -s tests -v
      - run: ./tools/bootstrap-installer.ps1 -Curl C:\msys64\usr\bin\curl.exe
      - run: ./build-installer.ps1 -Check
      - run: ./build-portable.ps1 -SkipBuild
      - run: ./tools/write-checksums.ps1
      - name: Verify current-user and all-users install and uninstall
        run: ./tools/test-installer.ps1
      - name: Verify live PubChem lookup
        if: inputs.verify_pubchem
        run: |
          . ./tools/env.ps1
          cargo test --locked pubchem::tests::live_pubchem_smoke -- --ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: solcalc-windows-x64-${{ github.run_number }}
          path: |
            dist/Solcalc.exe
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            .tools/installer-smoke/*.log
            .tools/installer-smoke/result.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
