name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          - language: rust
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust analysis
        if: matrix.language == 'rust'
        shell: pwsh
        run: |
          rustup toolchain install --no-self-update --component rust-src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          . ./tools/env.ps1
          foreach ($key in @('RC', 'LIB', 'INCLUDE', 'CARGO_HOME')) {
            $value=[Environment]::GetEnvironmentVariable($key)
            if ($value) { "$key=$value" >> $env:GITHUB_ENV }
          }
          $env:PATH.Split(';') | Where-Object { $_ } | Select-Object -Unique >> $env:GITHUB_PATH
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .tools/**
              - target/**
              - dist/**
              - qa/**
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
