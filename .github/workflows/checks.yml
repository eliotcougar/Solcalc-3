name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks and tests
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/cargo
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format, lint, test and build
        run: ./build.ps1 -Check
      - name: Validate dependency notices
        run: |
          . ./tools/env.ps1
          python tools/update-notices.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  catalog:
    name: Catalog validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python tools/generate-catalog.py --check
      - run: python -m unittest discover -s tests -v
