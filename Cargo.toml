[package]
name = "solcalc"
version = "3.5.1"
edition = "2021"
rust-version = "1.89"
description = "A fast, native Windows solution calculator"
build = "build.rs"

[dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "serialize", "backup"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
